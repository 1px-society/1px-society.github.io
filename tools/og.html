<!doctype html>
<meta charset="utf-8">
<title>og build</title>
<link rel="stylesheet" href="/unse/css/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script type="module">
  import { pillar } from '/unse/js/saju.js';
  import { TAGLINE } from '/unse/js/data.js';
  import { renderOg, ensureFonts } from '/unse/js/card.js';
  import { drawLogo } from '/unse/js/sprites.js';
  const all = Array.from({ length: 60 }, (_, i) => pillar(i));
  await ensureFonts([...all.map((p) => `${p.name}일주 ${p.colorWord} ${p.animal} ${TAGLINE[p.name]}`), '친구의 일주는 너는 무슨 일주야? 오늘 운세 보기 → 오늘의 운세 생일 하나로 보는 나의 일주와 1px-society.github.io/unse · @1px.society']);
  const out = { default: renderOg(null).toDataURL('image/png') };
  for (const p of all) out[p.id] = renderOg(p, TAGLINE[p.name]).toDataURL('image/png');
  const icon = document.createElement('canvas');
  icon.width = icon.height = 180;
  const ctx = icon.getContext('2d');
  ctx.fillStyle = '#f7d35a';
  ctx.beginPath(); ctx.arc(90, 90, 90, 0, Math.PI * 2); ctx.fill();
  drawLogo(ctx, 25, 25, 13);
  out.icon = icon.toDataURL('image/png');
  window.OG = out;
  document.body.dataset.ready = '1';
</script>
